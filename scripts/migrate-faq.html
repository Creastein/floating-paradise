  accommodationFaqs: [

  foodFaqs: [
    { _key: key(), question: "Is breakfast included?", question_id: "Apakah sarapan sudah termasuk?", answer: "Yes, breakfast is included with every stay.", answer_id: "Ya, sarapan sudah termasuk dalam setiap penginapan." },
    { _key: key(), question: "Can you order lunch and dinner at Floating?", question_id: "Bisakah memesan makan siang dan makan malam di Floating?", answer: "Yes, we serve lunch and dinner — just pre-order with us so we can prepare everything fresh.", answer_id: "Ya, kami menyediakan makan siang dan makan malam — cukup pesan terlebih dahulu agar kami bisa menyiapkan semuanya dengan segar." }

  bookingFaqs: [
    { _key: key(), question: "Is early check-in possible?", question_id: "Apakah early check-in bisa dilakukan?", answer: "Yes, on request we can try to have your room ready earlier — the earliest possible is 11:00 AM if there were previous guests in the room.", answer_id: "Ya, atas permintaan kami akan berusaha menyiapkan kamar lebih awal — paling awal pukul 11:00 siang jika ada tamu sebelumnya." },

    { _key: key(), question: "How long does it take to walk into town?", question_id: "Berapa lama jalan kaki ke kota?", answer: "It takes approximately 1 hour to walk into town from Floating Paradise.", answer_id: "Sekitar 1 jam berjalan kaki dari Floating Paradise ke pusat kota." },

  ],
  activitiesFaqs: [
    { _key: key(), question: "Can guests use the kayaks?", question_id: "Bisakah tamu menggunakan kayak?", answer: "Yes, kayak use is free of charge for all guests. We also provide complimentary masks and snorkels.", answer_id: "Ya, penggunaan kayak gratis untuk semua tamu. Kami juga menyediakan masker dan snorkel secara gratis." },
    { _key: key(), question: "Can you fish at Floating?", question_id: "Bisakah memancing di Floating?", answer: "Yes! We also rent fishing equipment at Rp 150,000 per set per day.", answer_id: "Ya! Kami juga menyewakan peralatan memancing seharga Rp 150.000 per set per hari." },
    { _key: key(), question: "What activities can be done directly from Floating?", question_id: "Aktivitas apa saja yang bisa dilakukan langsung dari Floating?", answer: "You can swim, snorkel, kayak, join sunset yoga, take a beach walk, visit the turtle sanctuary, or book a private eco boat tour — all directly from our pier.", answer_id: "Anda bisa berenang, snorkeling, kayak, ikut yoga sunset, jalan-jalan di pantai, mengunjungi penangkaran penyu, atau memesan eco boat tour privat — semua langsung dari dermaga kami." }
  ]
};

async function migrate() {
  addLog('Starting FAQ migration to Sanity...');
  addLog('Document: ' + JSON.stringify(doc, null, 2).substring(0, 200) + '...');
  
  const url = `https://${PROJECT_ID}.api.sanity.io/v${API_VERSION}/data/mutate/${DATASET}`;
  
  try {
    const response = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${TOKEN}`
      },
      body: JSON.stringify({
        mutations: [
          { createOrReplace: doc }
        ]
      })
    });
    
    const result = await response.json();
    
    if (response.ok) {
      addLog('✅ Migration successful!');
      addLog('Response: ' + JSON.stringify(result, null, 2));
    } else {
      addLog('❌ Migration failed with status: ' + response.status);
      addLog('Error: ' + JSON.stringify(result, null, 2));
    }
  } catch (err) {
    addLog('❌ Migration error: ' + err.message);
  }
}

migrate();
</script>
